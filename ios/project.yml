name: PokuExpenses
options:
  bundleIdPrefix: day.poku
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PokuExpenses:
    type: application
    platform: iOS
    sources:
      - path: PokuExpenses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.poku.myday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PokuExpenses/Info.plist
      properties:
        CFBundleDisplayName: Poku Expenses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Take a photo of a receipt to keep with your expense."
    entitlements:
      path: PokuExpenses/PokuExpenses.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.day.poku.myday]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
  PokuExpensesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PokuExpensesTests
    dependencies:
      - target: PokuExpenses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.poku.myday.tests
        GENERATE_INFOPLIST_FILE: YES
  PokuExpensesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PokuExpensesUITests
    dependencies:
      - target: PokuExpenses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.poku.myday.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PokuExpenses
schemes:
  PokuExpenses:
    build:
      targets:
        PokuExpenses: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PokuExpensesTests
  PokuExpensesUI:
    build:
      targets:
        PokuExpenses: all
        PokuExpensesUITests: [test]
    test:
      config: Debug
      targets:
        - PokuExpensesUITests
